<!DOCTYPE html>
<html>
<head>
    <title>Project Time Predictor</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f4f4f4;
        }
        form {
            background: white;
            padding: 20px;
            margin: 50px auto;
            width: 300px;
            border-radius: 10px;
        }
        input {
            margin: 5px;
            padding: 8px;
            width: 90%;
        }
        button {
            padding: 10px;
            background: #007BFF;
            color: white;
            border: none;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h2>🚀 Project Time Predictor</h2>

<form action="/predict" method="post">
    <input type="number" name="employees" placeholder="Employees" required>
    <input type="number" name="complexity" placeholder="Complexity (1-10)" required>
    <input type="number" name="experience" placeholder="Experience (years)" required>
    <input type="number" name="modules" placeholder="Modules" required>
    <input type="number" name="working_hours" placeholder="Working Hours" required>
    <input type="number" name="deadline_pressure" placeholder="Deadline (1-3)" required>
    <input type="number" name="requirement_clarity" placeholder="Clarity (1-5)" required>

    <button type="submit">Predict</button>
</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
